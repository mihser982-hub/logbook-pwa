<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LogBook</title>

  <link rel="manifest" href="./manifest.json">

  <meta name="theme-color" content="#4f46e5" />
  <link rel="icon" href="icon-192.png" />

  <style>
    :root {
      --bg: #f4efe6;
      --paper: #faf6ee;
      --ink: #2c261c;
      --muted: #8a8174;
      --line: #e4d9c8;
      --accent: #5c5346;
      --danger: #8a4a3a;
      --text: var(--ink);
      --primary: var(--accent);
      --card: var(--paper);
      --border: var(--line);
      --shadow: none;
      --icon-color: var(--accent);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      background: var(--paper);
      box-shadow: none;
      padding: 12px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .toolbar {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: nowrap;
      margin-bottom: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--line);
      padding-bottom: 8px;
    }

    .logo {
      font-weight: 700;
      font-size: 18px;
      margin-right: auto;
      color: var(--ink);
      white-space: nowrap;
    }

    input, textarea {
      font: inherit;
      padding: 6px 8px;
      border-radius: 0;
      border: none;
      outline: none;
      background: transparent;
      color: var(--ink);
    }

    input:focus, textarea:focus {
      border: none;
      box-shadow: none;
    }

    #titleInput {
      width: 100%;
      flex-shrink: 0;
      font-weight: 700;
      background: transparent;
    }

    #bodyInput, #previewContainer {
      width: 100%;
      flex: 1;
      resize: none;
      margin-top: 8px;
      overflow-y: auto;
    }

    #bodyInput {
      display: none;
      min-height: 0;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", Menlo, Monaco, "Courier New", monospace;
      font-size: 15px;
      line-height: 1.65;
      tab-size: 2;
      background: transparent;
    }

    #previewContainer {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 4px 2px 10px;
      line-height: 1.7;
      display: block;
      color: var(--ink);
    }

    #previewContainer h1,
    #previewContainer h2,
    #previewContainer h3,
    #previewContainer h4,
    #previewContainer h5,
    #previewContainer h6 {
      margin-top: 1em;
      margin-bottom: 0.5em;
      font-weight: 600;
      line-height: 1.3;
    }

    #previewContainer h1 { font-size: 1.8em; }
    #previewContainer h2 { font-size: 1.5em; }
    #previewContainer h3 { font-size: 1.3em; }
    #previewContainer h4 { font-size: 1.1em; }

    #previewContainer p { margin-bottom: 0.8em; }
    #previewContainer strong { font-weight: 600; }
    #previewContainer em { font-style: italic; }

    #previewContainer ul,
    #previewContainer ol {
      margin-left: 1.5em;
      margin-bottom: 0.8em;
    }

    #previewContainer li { margin-bottom: 0.3em; }

    #previewContainer code {
      background: transparent;
      padding: 0;
      border-radius: 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.9em;
      color: var(--accent);
    }

    #previewContainer pre {
      background: transparent;
      padding: 8px 0;
      border-radius: 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      margin-bottom: 0.8em;
    }

    #previewContainer pre code {
      background: none;
      padding: 0;
    }

    #previewContainer blockquote {
      border-left: 2px solid var(--line);
      padding-left: 12px;
      margin-left: 0;
      margin-bottom: 0.8em;
      color: var(--muted);
    }

    #previewContainer table {
      width: 100%;
      max-width: 100%;
      border-collapse: collapse;
      margin-bottom: 0.8em;
      font-size: 0.9em;
    }

    #previewContainer th,
    #previewContainer td {
      border: 1px solid var(--line);
      padding: 6px 8px;
      text-align: left;
    }

    #previewContainer th {
      background: transparent;
      font-weight: 600;
    }

    #previewContainer input[type="checkbox"] { margin-right: 6px; }

    #previewContainer .footnote-ref {
      font-size: 0.8em;
      vertical-align: super;
      margin-left: 2px;
    }

    #previewContainer .footnotes {
      margin-top: 1em;
      padding-top: 0.5em;
      border-top: 1px solid var(--line);
      font-size: 0.85em;
      color: var(--muted);
    }

    #previewContainer a,
    .previewContainer a {
      color: var(--accent);
    }

    #previewContainer a.internal-link {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    #previewContainer a.internal-link:hover { color: var(--ink); }

    #previewContainer .foldable-heading { cursor: pointer; }

    #previewContainer .foldable-heading.collapsed::after {
      content: ' ...';
      color: var(--muted);
      margin-left: 8px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: transparent;
      color: var(--accent);
      border: none;
      box-shadow: none;
      cursor: pointer;
      padding: 6px 8px;
      border-radius: 8px;
      font: inherit;
    }

    button:hover {
      background: transparent;
      color: var(--ink);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button.secondary,
    button.danger,
    .settingsBtn,
    .backToTagsBtn {
      background: transparent;
      color: var(--accent);
    }

    button.danger,
    .dangerBtn {
      color: var(--danger);
    }

    button.danger:hover,
    .dangerBtn:hover {
      color: #6e3a2e;
      background: transparent;
    }

    .iconBtn,
    .primaryBtn,
    .dangerBtn {
      width: 36px;
      height: 36px;
      padding: 0;
    }

    .icon {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .drawer {
      margin-top: 12px;
      padding: 10px 0;
      background: transparent;
      border: none;
      border-radius: 0;
      display: none;
      overflow-y: auto;
      flex-shrink: 0;
    }

    .drawer.open { display: block; }

    #searchInput {
      width: 100%;
      margin-top: 8px;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
    }

    .notesList {
      margin-top: 10px;
      display: grid;
      gap: 2px;
    }

    .noteCard,
    .recentItem {
      background: transparent;
      border: none;
      border-radius: 0;
      padding: 8px 2px;
      cursor: pointer;
    }

    .noteCard:hover,
    .recentItem:hover {
      background: transparent;
      color: var(--accent);
    }

    .noteCard h3 {
      font-size: 15px;
      margin: 0;
      font-weight: 400;
    }

    .noteCard .meta,
    .recentItem .time { display: none; }

    .recentList {
      margin-top: 10px;
      display: grid;
      gap: 2px;
    }

    .recentItem { font-size: 13px; }

    .recentItem .title {
      font-weight: 600;
      margin-bottom: 0;
    }

    .calendarPanel {
      margin-top: 0;
      padding: 0;
      background: transparent;
      border: none;
      display: block;
    }

    .calendarHeader {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .calendarGrid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
      padding: 6px 4px 8px;
    }

    .calendarCell {
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 2px;
      text-align: center;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      min-width: 0;
      color: var(--ink);
    }

    .calendarCell:hover {
      border-color: var(--accent);
      background: transparent;
    }

    .calendarCell.hasNote {
      background: transparent;
      border-color: var(--accent);
      font-weight: 600;
    }

    .calendarCell.today {
      outline: none;
      box-shadow: inset 0 0 0 1px var(--accent);
    }

    .calendarWeekday {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 4px 0;
    }

    .task-checkbox {
      appearance: none;
      width: 18px;
      height: 18px;
      margin: 0 7px 0 0;
      padding: 0;
      border: 1px solid var(--accent);
      border-radius: 50%;
      background: transparent;
      vertical-align: -4px;
      cursor: pointer;
      position: relative;
      color: var(--accent);
    }

    .task-checkbox::after {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .task-checkbox[data-state="backlog"]::after { content: "\25CC"; }
    .task-checkbox[data-state="todo"]::after { content: ""; }
    .task-checkbox[data-state="doing"]::after { content: "\25D0"; }
    .task-checkbox[data-state="review"]::after { content: "\2691"; }
    .task-checkbox[data-state="done"]::after { content: "\2713"; }
    .task-checkbox[data-state="cancelled"]::after { content: "\00D7"; }

    .task-checkbox[data-state="backlog"],
    .task-checkbox[data-state="todo"],
    .task-checkbox[data-state="doing"],
    .task-checkbox[data-state="review"],
    .task-checkbox[data-state="done"] {
      background: transparent;
      border-color: var(--accent);
    }

    .task-checkbox[data-state="cancelled"] {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
    }

    .task-checkbox[data-state="cancelled"]::after { color: var(--danger); }

    .task-checkbox:hover { filter: none; opacity: 0.75; }

    .task-text-done,
    .task-text-cancelled {
      color: var(--muted);
      text-decoration: line-through;
    }

    .panelOverlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      background: rgba(44, 38, 28, 0.28);
      padding: 10px;
    }

    .panelOverlay.open {
      display: flex;
      align-items: flex-start;
      justify-content: center;
    }

    .panelModal {
      width: min(900px, 100%);
      max-height: 70vh;
      margin-top: 0;
      padding: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    #menuOverlay {
      padding: 16px 10px;
      align-items: stretch;
      justify-content: center;
    }

    #menuOverlay .panelModal {
      width: min(900px, 100%);
      height: auto;
      max-height: none;
      margin-top: 0;
    }

    #menuOverlay .panelModalBody {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #menuOverlay #drawer {
      flex: 1;
      min-height: 0;
      margin-top: 0;
      overflow: hidden;
    }

    #menuOverlay #drawer.open {
      display: flex;
      flex-direction: column;
    }

    #menuOverlay .menuSection {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      min-height: 0;
      margin-bottom: 8px;
      background: transparent;
      border-radius: 0;
    }

    #menuOverlay .menuSection:last-child { margin-bottom: 0; }

    #menuOverlay .menuSection:not(.collapsed) { flex: 1 1 0; }

    #menuOverlay .menuSectionBody {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #menuOverlay .menuSectionBody .notesList,
    #menuOverlay .menuSectionBody .recentList,
    #menuOverlay .tagsList,
    #menuOverlay .tagPagesList {
      flex: 1 1 auto;
      max-height: none;
      min-height: 0;
      overflow-y: auto;
    }

    #menuOverlay #tagPagesView:not([hidden]) {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #menuOverlay .menuSection.collapsed .menuSectionBody { display: none; }

    .panelModalHeader {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    .panelModalTitle {
      margin-right: auto;
      font-size: 16px;
      font-weight: 700;
    }

    .menuToolbar {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      margin-bottom: 10px;
    }

    .menuToolbar button { min-width: 36px; }

    .panelModalClose { flex: 0 0 auto; }

    .panelModalBody {
      min-height: 0;
      overflow-y: auto;
    }

    #calendarOverlay .panelModal { max-width: 420px; }

    .calendarHeader select {
      appearance: none;
      -webkit-appearance: none;
      min-height: 36px;
      padding: 7px 34px 7px 10px;
      border: none;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background-color: transparent;
      color: var(--ink);
      font-weight: 600;
      cursor: pointer;
      background-image:
              linear-gradient(45deg, transparent 50%, var(--muted) 50%),
              linear-gradient(135deg, var(--muted) 50%, transparent 50%);
      background-position:
              calc(100% - 15px) 15px,
              calc(100% - 10px) 15px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
    }

    .calendarHeader select:focus,
    .calendarHeader select:hover {
      outline: none;
      border-color: var(--accent);
      box-shadow: none;
      background-color: transparent;
    }

    #calendarMonthSelect { flex: 1 1 170px; }
    #calendarYearSelect { flex: 0 1 105px; }

    .tagsEditor {
      flex-shrink: 0;
      margin-top: 6px;
    }

    .tagsEditor label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 12px;
    }

    #tagsInput {
      width: 100%;
      color: var(--ink);
      background: transparent;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }

    .tagsHint {
      margin-top: 2px;
      color: var(--muted);
      font-size: 11px;
    }

    .noteTagsView {
      display: none;
      flex-shrink: 0;
      margin-top: auto;
      padding: 6px 0 2px;
      border-top: 1px solid var(--line);
    }

    .noteTagsView.visible {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .noteTag {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 3px 0;
      margin-right: 10px;
      border-radius: 0;
      background: transparent;
      color: var(--accent);
      font-size: 12px;
      cursor: pointer;
    }

    .noteTag:hover { background: transparent; color: var(--ink); }

    .menuSection {
      margin-bottom: 12px;
      border-radius: 0;
      background: transparent;
      overflow: hidden;
    }

    .menuSectionHeader {
      width: 100%;
      justify-content: space-between;
      padding: 9px 2px;
      background: transparent;
      color: var(--ink);
      font-weight: 700;
      text-align: left;
      border-bottom: 1px solid var(--line);
    }

    .menuSectionHeader:hover {
      background: transparent;
      color: var(--ink);
    }

    .menuSectionChevron {
      font-size: 18px;
      line-height: 1;
      transition: transform 0.15s ease;
    }

    .menuSection.collapsed .menuSectionChevron { transform: rotate(-90deg); }

    .menuSectionBody { padding: 8px 2px; }
    .menuSection.collapsed .menuSectionBody { display: none; }

    .menuSectionBody #searchInput {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .menuSectionBody .notesList,
    .menuSectionBody .recentList,
    .tagsList,
    .tagPagesList {
      max-height: 220px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .tagsList,
    .tagPagesList {
      display: grid;
      gap: 2px;
    }

    .tagLink,
    .tagPageLink,
    #allTagsBtn {
      width: 100%;
      justify-content: flex-start;
      padding: 7px 2px;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      text-align: left;
      box-shadow: none;
    }

    .tagLink:hover,
    .tagPageLink:hover {
      background: transparent;
      color: var(--accent);
    }

    .tagCount {
      margin-left: auto;
      color: var(--muted);
      font-size: 12px;
    }

    .selectedTagTitle {
      margin: 8px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .backToTagsBtn {
      width: 100%;
      justify-content: flex-start;
      margin-bottom: 5px;
    }

    .settingsSection {
      margin-bottom: 16px;
      padding: 12px 0;
      background: transparent;
      border-radius: 0;
      border-bottom: 1px solid var(--line);
    }

    .settingsSection h3 {
      font-size: 14px;
      margin-bottom: 10px;
      color: var(--muted);
    }

    .settingsCheckbox {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .settingsLabel {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .settingsInput {
      width: 100%;
      margin-top: 4px;
      padding: 8px 0;
      background: transparent;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }

    .settingsBtn {
      margin-top: 8px;
      padding: 8px 0;
      background: transparent;
      color: var(--accent);
    }

    .settingsBtn:hover {
      background: transparent;
      color: var(--ink);
    }

    .passwordSection {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 600px) {
      .app { padding: 10px; }
      .logo { font-size: 16px; }
      .toolbar { gap: 4px; }

      .toolbar button,
      .menuToolbar button {
        padding: 6px;
        min-width: 36px;
        background: transparent;
      }

      #previewContainer { font-size: 15px; }

      .panelOverlay { padding: 14px 10px; }

      .panelModal {
        width: 100%;
        max-width: 520px;
        max-height: calc(100vh - 28px);
        margin-top: 18px;
        border-radius: 14px;
        padding: 12px 10px;
        background: var(--paper);
      }

      #menuOverlay {
        padding-top: 22px;
        padding-bottom: 22px;
      }

      #menuOverlay .panelModal {
        max-height: 70vh;
        margin-top: 0;
      }

      .menuSectionBody .notesList,
      .menuSectionBody .recentList,
      .tagsList,
      .tagPagesList {
        max-height: 180px;
      }
    }
  </style>

</head>
<body>
  <div class="app">
    <div class="toolbar">
      <button id="backBtn" type="button" title="Назад" disabled>
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
      </button>

      <button id="forwardBtn" type="button" title="Вперёд" disabled>
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>

      <div class="logo">LogBook</div>

      <button id="menuBtn" class="secondary" type="button" title="Меню">
        <svg class="icon" viewBox="0 0 24 24">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <button id="calendarBtn" type="button" title="Календарь">
        <svg class="icon" viewBox="0 0 24 24">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
      </button>

      <button id="editToggleBtn" type="button" title="Редактировать">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>

      <button id="deleteNoteBtn" class="danger" type="button" title="Удалить">
        <svg class="icon" viewBox="0 0 24 24">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>

    <input id="titleInput" type="text" placeholder="Заголовок заметки" />

    <div id="tagsEditor" class="tagsEditor">
      <label for="tagsInput">Теги</label>
      <input id="tagsInput" type="text" placeholder="например: работа, проект, друг" autocomplete="off" />
      <div class="tagsHint">Разделяйте теги запятыми</div>
    </div>

    <textarea id="bodyInput" placeholder="Текст заметки (Markdown)..."></textarea>
    <div id="previewContainer"></div>
    <div id="noteTagsView" class="noteTagsView" aria-label="Теги заметки"></div>

    <div id="menuOverlay" class="panelOverlay" aria-hidden="true">
      <section class="panelModal" role="dialog" aria-modal="true" aria-labelledby="menuModalTitle">
        <div class="panelModalHeader">
          <h2 id="menuModalTitle" class="panelModalTitle">Меню</h2>
          <button id="closeMenuBtn" class="panelModalClose" type="button" title="Закрыть меню" aria-label="Закрыть меню">
            <svg class="icon" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="menuToolbar">
          <button id="exportBtn" type="button" title="Экспортировать резервную копию">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 3v12"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <path d="M5 21h14"></path>
            </svg>
          </button>
          <button id="importBtn" type="button" title="Импортировать резервную копию">
            <svg class="icon" viewBox="0 0 24 24">
              <path d="M12 21V9"></path>
              <polyline points="7 14 12 9 17 14"></polyline>
              <path d="M5 3h14"></path>
            </svg>
          </button>
          <button id="syncBtn" type="button" title="Синхронизировать с ПК">
            <svg class="icon" viewBox="0 0 24 24">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"></path>
              <path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"></path>
            </svg>
          </button>
          <button id="settingsBtn" type="button" title="Настройки">
            <svg class="icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
        </div>

        <input id="importFileInput" type="file" accept="application/json,.json" hidden />

        <div class="panelModalBody">
          <div id="drawer" class="drawer open">
            <section class="menuSection">
              <button id="viewedSectionBtn" class="menuSectionHeader" type="button" aria-expanded="true">
                <span>Просмотренные</span>
                <span class="menuSectionChevron">⌄</span>
              </button>
              <div id="viewedSectionBody" class="menuSectionBody">
                <div id="recentList" class="recentList"></div>
              </div>
            </section>

            <section class="menuSection">
              <button id="pagesSectionBtn" class="menuSectionHeader" type="button" aria-expanded="true">
                <span>Страницы</span>
                <span class="menuSectionChevron">⌄</span>
              </button>
              <div id="pagesSectionBody" class="menuSectionBody">
                <input id="searchInput" type="text" placeholder="Поиск по страницам..." />
                <div id="notesList" class="notesList"></div>
              </div>
            </section>

            <section class="menuSection">
              <button id="tagsSectionBtn" class="menuSectionHeader" type="button" aria-expanded="true">
                <span>Теги</span>
                <span class="menuSectionChevron">⌄</span>
              </button>
              <div id="tagsSectionBody" class="menuSectionBody">
                <div id="tagsList" class="tagsList"></div>
                <div id="tagPagesView" class="tagPagesView" hidden>
                  <button id="allTagsBtn" class="backToTagsBtn" type="button">← Все теги</button>
                  <div id="selectedTagTitle" class="selectedTagTitle"></div>
                  <div id="tagPagesList" class="tagPagesList"></div>
                </div>
              </div>
            </section>
          </div>
        </div>
      </section>
    </div>

    <div id="calendarOverlay" class="panelOverlay" aria-hidden="true">
      <section class="panelModal" role="dialog" aria-modal="true" aria-labelledby="calendarModalTitle">
        <div class="panelModalHeader">
          <h2 id="calendarModalTitle" class="panelModalTitle">Календарь</h2>
          <button id="closeCalendarBtn" class="panelModalClose" type="button" title="Закрыть календарь" aria-label="Закрыть календарь">
            <svg class="icon" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="panelModalBody">
          <div id="calendarPanel" class="calendarPanel">
            <div class="calendarHeader">
              <select id="calendarMonthSelect"></select>
              <select id="calendarYearSelect"></select>
            </div>
            <div class="calendarGrid" id="calendarWeekdaysGrid"></div>
            <div class="calendarGrid" id="calendarDaysGrid"></div>
          </div>
        </div>
      </section>
    </div>

    <div id="settingsOverlay" class="panelOverlay" aria-hidden="true">
      <section class="panelModal" role="dialog" aria-modal="true" aria-labelledby="settingsModalTitle">
        <div class="panelModalHeader">
          <h2 id="settingsModalTitle" class="panelModalTitle">Настройки</h2>
          <button id="closeSettingsBtn" class="panelModalClose" type="button" title="Закрыть настройки" aria-label="Закрыть настройки">
            <svg class="icon" viewBox="0 0 24 24">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="panelModalBody">
          <div class="settingsSection">
            <h3>Шифрование</h3>
            <label class="settingsCheckbox">
              <input type="checkbox" id="enableEncryptionCheckbox">
              Включить шифрование заметок
            </label>
            <div id="passwordSection" class="passwordSection" style="display:none;">
              <label class="settingsLabel">
                Пароль шифрования:
                <input type="password" id="encryptionPasswordInput" placeholder="Минимум 12 символов" class="settingsInput">
              </label>
              <button id="savePasswordBtn" type="button" class="settingsBtn">Сохранить пароль</button>
              <button id="changePasswordBtn" type="button" class="settingsBtn" style="display:none;">Сменить пароль</button>
            </div>
          </div>

          <div class="settingsSection">
            <h3>Безопасность</h3>
            <label class="settingsLabel">
              Максимум попыток ввода пароля:
              <input type="number" id="maxAttemptsInput" min="1" max="20" value="7" class="settingsInput">
            </label>
            <button id="saveMaxAttemptsBtn" type="button" class="settingsBtn">Сохранить</button>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="markdown-it.min.js"></script>
  <script src="markdown-it-checkbox.min.js"></script>
  <script src="markdown-it-footnote.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
  <script src="app.js"></script>
</body>
</html>
